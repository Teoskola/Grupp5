name: Build

on:
  push:
    branches: [ Test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Grupp5.csproj

      - name: Build
        run: dotnet build Grupp5.csproj --configuration Release --no-restore
